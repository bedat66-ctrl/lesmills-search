<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PALE PEARL — Pattern F</title>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f0ede8;
      font-family: 'Josefin Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background: #2a2826;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-brand { font-size: 10px; letter-spacing: 0.5em; color: #b8a98a; }
    .header-title { font-size: 11px; letter-spacing: 0.3em; color: #888; }

    .decided-banner {
      margin: 32px 0 8px;
      font-size: 9px;
      letter-spacing: 0.5em;
      color: #b8a98a;
      text-transform: uppercase;
    }
    .pattern-name {
      font-size: 22px;
      letter-spacing: 0.18em;
      color: #2a2826;
      margin-bottom: 4px;
    }
    .pattern-theme {
      font-size: 10px;
      letter-spacing: 0.15em;
      color: #b8a98a;
      margin-bottom: 16px;
    }

    .swatch-row { display: flex; gap: 8px; margin-bottom: 24px; }
    .swatch {
      width: 28px; height: 28px;
      border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .frame-wrap {
      width: 296px;
      height: 1260px;
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.13);
      background: #fff;
      margin-bottom: 48px;
    }
    .frame-wrap iframe {
      width: 375px;
      height: 1600px;
      border: none;
      transform: scale(0.789);
      transform-origin: top left;
      pointer-events: none;
    }

    .badge {
      font-size: 9px;
      letter-spacing: 0.18em;
      background: #2a2826;
      color: #b8a98a;
      border-radius: 20px;
      padding: 4px 16px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<header>
  <div class="header-brand">P A L E &nbsp; P E A R L</div>
  <div class="header-title">OFFICIAL FEED PATTERN</div>
</header>

<div class="decided-banner">✓ 採用決定</div>
<div class="pattern-name">Pattern F</div>
<div class="pattern-theme">グレージュ × チャコール — 石灰の光</div>
<div class="swatch-row">
  <div class="swatch" style="background:#e4e2dc;border:1px solid #d8d4d0"></div>
  <div class="swatch" style="background:#bebab6"></div>
  <div class="swatch" style="background:#82807c"></div>
  <div class="swatch" style="background:#565250"></div>
  <div class="swatch" style="background:#3a3836"></div>
</div>
<div class="badge">PALE PEARL — DECIDED</div>

<div class="frame-wrap">
  <iframe src="/pale-instagram6.html" scrolling="no"></iframe>
</div>

</body>
</html>
