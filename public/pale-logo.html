<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PALE — Brand Colors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 64px;
      padding: 64px 40px;
      font-family: 'Helvetica Neue', sans-serif;
    }
    .section-title {
      font-size: 9px;
      letter-spacing: 0.3em;
      color: #444;
      text-transform: uppercase;
      margin-bottom: 20px;
      text-align: center;
    }
    .block { display: flex; flex-direction: column; align-items: center; }

    /* ── Logo ── */
    .logo-dark, .logo-light, .logo-beige {
      width: 480px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-dark   { background: #111111; }
    .logo-light  { background: #f7f6f4; }
    .logo-beige  { background: #EDE6DC; }

    .wordmark {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 52px;
      letter-spacing: 0.55em;
      text-transform: uppercase;
      padding-left: 0.55em;
    }
    .logo-dark  .wordmark { color: #e8e8e8; }
    .logo-light .wordmark { color: #1c1c1c; }
    .logo-beige .wordmark { color: #2a2520; }

    /* ── Color chips ── */
    .chips {
      display: flex;
      width: 480px;
    }
    .chip {
      flex: 1;
      height: 72px;
    }
    .chip-labels {
      display: flex;
      width: 480px;
    }
    .chip-label {
      flex: 1;
      padding-top: 8px;
      font-size: 8px;
      letter-spacing: 0.1em;
      color: #444;
      text-align: center;
      line-height: 1.6;
    }

    /* ── Tagline mock ── */
    .tagline-card {
      width: 480px;
      height: 160px;
      background: #EDE6DC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .tagline-word {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 28px;
      letter-spacing: 0.4em;
      color: #2a2520;
      padding-left: 0.4em;
    }
    .tagline-line {
      width: 32px;
      height: 1px;
      background: #2a2520;
      opacity: 0.4;
    }
    .tagline-sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: #7a6e63;
    }
  </style>
</head>
<body>

  <!-- ロゴ3パターン -->
  <div class="block">
    <div class="section-title">Logo — 3 backgrounds</div>
    <div class="logo-dark"><span class="wordmark">PALE</span></div>
    <div class="logo-beige"><span class="wordmark">PALE</span></div>
    <div class="logo-light"><span class="wordmark">PALE</span></div>
  </div>

  <!-- 確定カラーパレット -->
  <div class="block">
    <div class="section-title">Brand Colors — confirmed</div>
    <div class="chips">
      <div class="chip" style="background:#111111"></div>
      <div class="chip" style="background:#2c2c2c"></div>
      <div class="chip" style="background:#7a7a7a"></div>
      <div class="chip" style="background:#f7f6f4"></div>
      <div class="chip" style="background:#EDE6DC"></div>
      <div class="chip" style="background:#C8B99A"></div>
    </div>
    <div class="chip-labels">
      <div class="chip-label">Black<br>#111</div>
      <div class="chip-label">Charcoal<br>#2c2c2c</div>
      <div class="chip-label">Grey<br>#7a7a7a</div>
      <div class="chip-label">Off White<br>#f7f6f4</div>
      <div class="chip-label">Pale Beige<br>#EDE6DC</div>
      <div class="chip-label">Warm Sand<br>#C8B99A</div>
    </div>
  </div>

  <!-- タグライン候補プレビュー -->
  <div class="block">
    <div class="section-title">Tagline preview — 「動く日も、纏う。」</div>
    <div class="tagline-card">
      <div class="tagline-word">PALE</div>
      <div class="tagline-line"></div>
      <div class="tagline-sub">動く日も、纏う。</div>
    </div>
  </div>

</body>
</html>
